name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mailquay
          POSTGRES_PASSWORD: mailquay
          POSTGRES_DB: mailquay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mailquay -d mailquay_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MAILQUAY_TEST_DATABASE_URL: postgres://mailquay:mailquay@127.0.0.1:5432/mailquay_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: go vet
        run: go vet ./...
      - name: unit tests
        run: go test -race ./...
      - name: integration tests
        run: go test -tags=integration ./test/integration/...
      - name: build api
        run: make build
      - name: generated code is current
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.5.0
          make generate
          git diff --exit-code
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: build frontend from main
        run: |
          for attempt in 1 2 3; do
            rm -rf /tmp/frontend
            if timeout 300 git clone --depth 1 https://github.com/MailQuay/frontend.git /tmp/frontend; then
              break
            fi
            echo "frontend clone failed (attempt ${attempt}/3), retrying in 10s" >&2
            sleep 10
          done
          [ -d /tmp/frontend/.git ] || { echo "::error::could not clone the frontend repository"; exit 1; }
          cd /tmp/frontend
          timeout 900 corepack pnpm install --frozen-lockfile
          timeout 600 corepack pnpm build
          mkdir -p "$GITHUB_WORKSPACE/internal/webassets" "$GITHUB_WORKSPACE/webassets"
          rm -rf "$GITHUB_WORKSPACE/internal/webassets/dist" "$GITHUB_WORKSPACE/webassets/dist"
          cp -R dist "$GITHUB_WORKSPACE/internal/webassets/dist"
          cp -R dist "$GITHUB_WORKSPACE/webassets/dist"
      - name: build embedded binary
        run: make build-full
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: webassets
          retention-days: 7
  images:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUSH_IMAGES: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: full, target: full-prebuilt, suffix: "" }
          - { variant: core, target: core, suffix: "-core" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: /tmp/frontend-dist
      - name: resolve image tags
        id: tags
        run: |
          sha="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          short="$(printf '%s' "${sha}" | cut -c1-7)"
          suffix="${{ matrix.suffix }}"
          {
            echo 'tags<<EOF'
            echo "ghcr.io/mailquay/mailquay:${short}${suffix}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "tag=${short}${suffix}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH_IMAGES == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-contexts: |
            frontend=/tmp/frontend-dist
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          build-args: |
            VERSION=${{ steps.tags.outputs.tag }}
            COMMIT=${{ github.sha }}
