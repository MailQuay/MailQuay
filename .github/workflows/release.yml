name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: build frontend
        run: |
          version="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            rm -rf /tmp/frontend
            if timeout 300 git clone --depth 1 --branch "${version}" https://github.com/MailQuay/frontend.git /tmp/frontend; then
              break
            fi
            echo "frontend clone failed (attempt ${attempt}/3), retrying in 10s" >&2
            sleep 10
          done
          [ -d /tmp/frontend/.git ] || { echo "::error::frontend tag ${version} is missing; push the frontend ${version} tag before the backend release"; exit 1; }
          cd /tmp/frontend
          timeout 900 corepack pnpm install --frozen-lockfile
          timeout 600 corepack pnpm build
          mkdir -p "$GITHUB_WORKSPACE/webassets"
          rm -rf "$GITHUB_WORKSPACE/webassets/dist"
          cp -R dist "$GITHUB_WORKSPACE/webassets/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: webassets
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: /tmp/frontend-dist
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p internal/webassets
          rm -rf internal/webassets/dist
          cp -R /tmp/frontend-dist/dist internal/webassets/dist
          exe=""
          [ "${GOOS}" = "windows" ] && exe=".exe"
          ldflags="-s -w -X main.version=${VERSION} -X main.commit=${{ github.sha }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath -ldflags "${ldflags}" -o "mailquay-core${exe}" ./cmd/mailquay
          go build -trimpath -tags full -ldflags "${ldflags}" -o "mailquay${exe}" ./cmd/mailquay
          if [ "${GOOS}" = "windows" ]; then
            7z a "mailquay-core_${VERSION}_${GOOS}_${GOARCH}.zip" mailquay-core.exe
            7z a "mailquay_${VERSION}_${GOOS}_${GOARCH}.zip" mailquay.exe
          else
            tar -czf "mailquay-core_${VERSION}_${GOOS}_${GOARCH}.tar.gz" mailquay-core
            tar -czf "mailquay_${VERSION}_${GOOS}_${GOARCH}.tar.gz" mailquay
          fi
          rm -f mailquay mailquay-core "mailquay-core${exe}"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: mailquay*_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.*
  images:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: full, target: full-prebuilt, suffix: "" }
          - { variant: core, target: core, suffix: "-core" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: /tmp/frontend-dist
      - name: resolve image tags
        id: tags
        run: |
          short="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          suffix="${{ matrix.suffix }}"
          {
            echo 'tags<<EOF'
            echo "ghcr.io/mailquay/mailquay:${GITHUB_REF_NAME}${suffix}"
            echo "ghcr.io/mailquay/mailquay:latest${suffix}"
            echo "ghcr.io/mailquay/mailquay:${short}${suffix}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
  publish:
    needs: [binaries, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > checksums.txt
      - name: publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
