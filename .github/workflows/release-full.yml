name: release-full
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  check-frontend:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(tr -d '[:space:]' < frontend.version)" >> "$GITHUB_OUTPUT"
      - name: require frontend tag
        run: |
          version="${{ steps.version.outputs.version }}"
          git ls-remote --tags --exit-code https://github.com/MailQuay/frontend.git "refs/tags/${version}"
  binaries:
    needs: check-frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: build frontend
        run: |
          git clone --depth 1 --branch "${{ needs.check-frontend.outputs.version }}" https://github.com/MailQuay/frontend.git /tmp/frontend
          cd /tmp/frontend
          pnpm install --frozen-lockfile
          pnpm build
          rm -rf "$GITHUB_WORKSPACE/internal/webassets/dist"
          cp -R dist "$GITHUB_WORKSPACE/internal/webassets/dist"
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          go build -trimpath -tags full -ldflags "-s -w -X main.version=$VERSION -X main.commit=${{ github.sha }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o mailquay${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/mailquay
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a "mailquay_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" mailquay.exe
            rm mailquay.exe
          else
            tar -czf "mailquay_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" mailquay
            rm mailquay
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: full-${{ matrix.goos }}-${{ matrix.goarch }}
          path: mailquay_*
  release:
    needs: [check-frontend, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > checksums-full.txt
      - name: publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
  image:
    needs: check-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch frontend
        run: git clone --depth 1 --branch "${{ needs.check-frontend.outputs.version }}" https://github.com/MailQuay/frontend.git /tmp/frontend
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: full
          platforms: linux/amd64,linux/arm64
          push: true
          build-contexts: |
            frontend=/tmp/frontend
          tags: ghcr.io/mailquay/mailquay:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
